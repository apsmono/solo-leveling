name: Sync Subprojects to External Repos

on:
  push:
    branches: [main]

jobs:
  sync-dashboard:
    name: Sync Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout solo-leveling
        uses: actions/checkout@v4

      - name: Checkout dashboard repo
        uses: actions/checkout@v4
        with:
          repository: apsmono/dashboard
          token: ${{ secrets.SYNC_PAT }}
          path: _target

      - name: Sync files
        run: |
          cp -r subprojects/dashboard/* _target/
          # Preserve .git and workflow-specific files
          cd _target
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: update from solo-leveling monorepo"
          git push origin main

  sync-wedding-invitation:
    name: Sync Wedding Invitation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout solo-leveling
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: subprojects/wedding-invitation/package-lock.json

      - name: Install dependencies and build
        working-directory: subprojects/wedding-invitation
        run: |
          npm ci
          npm run build

      - name: Checkout wedding-invitation repo
        uses: actions/checkout@v4
        with:
          repository: apsmono/wedding-invitation
          token: ${{ secrets.SYNC_PAT }}
          path: _target

      - name: Sync built files
        run: |
          # Clear old files except .git directory
          cd _target
          mv .git ../.git-temp || true
          rm -rf *
          rm -rf .[^.] .??* 2>/dev/null || true
          mv ../.git-temp .git || true
          cd ..
          # Copy built dist files
          cp -r subprojects/wedding-invitation/dist/* _target/
          cd _target
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: deploy built site from solo-leveling monorepo"
          git push origin main

  sync-koperasi:
    name: Sync Koperasi Landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout solo-leveling
        uses: actions/checkout@v4

      - name: Checkout koperasi repo
        uses: actions/checkout@v4
        with:
          repository: apsmono/koperasi
          token: ${{ secrets.SYNC_PAT }}
          path: _target

      - name: Sync files
        run: |
          cp -r subprojects/koperasi-landing/* _target/
          cd _target
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: update from solo-leveling monorepo"
          git push origin main
