name: Sync Subprojects to External Repos

on:
  push:
    branches: [main]

jobs:
  sync-dashboard:
    name: Sync Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout solo-leveling
        uses: actions/checkout@v4

      - name: Checkout dashboard repo
        uses: actions/checkout@v4
        with:
          repository: apsmono/dashboard
          token: ${{ secrets.SYNC_PAT }}
          path: _target

      - name: Sync files
        run: |
          cp -r subprojects/dashboard/* _target/
          # Preserve .git and workflow-specific files
          cd _target
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: update from solo-leveling monorepo"
          git push origin main

