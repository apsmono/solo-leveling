model_list:
  - model_name: kimi-autopilot
    litellm_params:
      # Use the latest 2026 reasoning model for coding tasks
      model: moonshot/kimi-k2.6
      api_key: os.environ/KIMI_API_KEY
      api_base: https://api.moonshot.ai/v1
      # Crucial for Autopilot: preserves the 'reasoning_content' in multi-turn tool calls
      extra_headers:
        "X-Kimi-Reasoning": "true"
      # Recommended settings for agent stability
      temperature: 0.1
      max_tokens: 8192

litellm_settings:
  # This fixes the common 2026 "lost context" bug in agentic loops
  drop_params: true
  set_verbose: false
  modify_params: true

router_settings:
  routing_strategy: simple-shuffle
