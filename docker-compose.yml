version: "3.9"

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solo-leveling-brain
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./library:/app/library
      - ./data:/app/data
      - ./.credentials:/app/.credentials:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
